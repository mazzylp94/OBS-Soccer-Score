<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Control Marcador</title>
<style>

body{
font-family:Arial,sans-serif;
padding:20px;
}

button{
padding:10px;
margin:3px;
font-size:16px;
}

input{
font-size:18px;
padding:5px;
}

.section{
margin-bottom:20px;
}

</style>
</head>

<body>

<h2>Control Marcador</h2>

<div class="section">

Local

<input id="localInput" value="BOC">

<br><br>

Visitante

<input id="awayInput" value="RIV">

<button onclick="saveTeams()">
Guardar Equipos
</button>

</div>

<div class="section">

<h3>Marcador</h3>

<button onclick="localMinus()">-</button>
<span id="localScoreView">0</span>
<button onclick="localPlus()">+</button>

&nbsp;&nbsp;&nbsp;

<button onclick="awayMinus()">-</button>
<span id="awayScoreView">0</span>
<button onclick="awayPlus()">+</button>

</div>

<div class="section">

<h3>Reloj</h3>

<button onclick="toggleClock()">
Play / Pausa
</button>

<button onclick="resetClock()">
Reiniciar
</button>

<button onclick="minus10()">
-10 seg
</button>

<button onclick="plus10()">
+10 seg
</button>

</div>

<div class="section">

<h3>Periodo</h3>

<button onclick="setPeriod('1T')">1T</button>
<button onclick="setPeriod('ET')">ET</button>
<button onclick="setPeriod('2T')">2T</button>
<button onclick="setPeriod('PR')">PR</button>
<button onclick="setPeriod('PEN')">PEN</button>

</div>

<div class="section">

<h3>Tiempo añadido</h3>

<button onclick="addedMinus()">-</button>

<span id="addedView">0</span>

<button onclick="addedPlus()">+</button>

<div class="section">

<h3>Penales</h3>

<table>

<tr>
<th></th>
<th>Gol</th>
<th>Errado</th>
<th>Borrar</th>
</tr>

<tr>
<td><b>Local P1</b></td>
<td><button onclick="setPenLocal(0,'G')">⚽</button></td>
<td><button onclick="setPenLocal(0,'E')">❌</button></td>
<td><button onclick="setPenLocal(0,'')">○</button></td>
</tr>

<tr>
<td><b>Local P2</b></td>
<td><button onclick="setPenLocal(1,'G')">⚽</button></td>
<td><button onclick="setPenLocal(1,'E')">❌</button></td>
<td><button onclick="setPenLocal(1,'')">○</button></td>
</tr>

<tr>
<td><b>Local P3</b></td>
<td><button onclick="setPenLocal(2,'G')">⚽</button></td>
<td><button onclick="setPenLocal(2,'E')">❌</button></td>
<td><button onclick="setPenLocal(2,'')">○</button></td>
</tr>

<tr>
<td><b>Local P4</b></td>
<td><button onclick="setPenLocal(3,'G')">⚽</button></td>
<td><button onclick="setPenLocal(3,'E')">❌</button></td>
<td><button onclick="setPenLocal(3,'')">○</button></td>
</tr>

<tr>
<td><b>Local P5</b></td>
<td><button onclick="setPenLocal(4,'G')">⚽</button></td>
<td><button onclick="setPenLocal(4,'E')">❌</button></td>
<td><button onclick="setPenLocal(4,'')">○</button></td>
</tr>

<tr><td colspan="4"><hr></td></tr>

<tr>
<td><b>Visitante P1</b></td>
<td><button onclick="setPenAway(0,'G')">⚽</button></td>
<td><button onclick="setPenAway(0,'E')">❌</button></td>
<td><button onclick="setPenAway(0,'')">○</button></td>
</tr>

<tr>
<td><b>Visitante P2</b></td>
<td><button onclick="setPenAway(1,'G')">⚽</button></td>
<td><button onclick="setPenAway(1,'E')">❌</button></td>
<td><button onclick="setPenAway(1,'')">○</button></td>
</tr>

<tr>
<td><b>Visitante P3</b></td>
<td><button onclick="setPenAway(2,'G')">⚽</button></td>
<td><button onclick="setPenAway(2,'E')">❌</button></td>
<td><button onclick="setPenAway(2,'')">○</button></td>
</tr>

<tr>
<td><b>Visitante P4</b></td>
<td><button onclick="setPenAway(3,'G')">⚽</button></td>
<td><button onclick="setPenAway(3,'E')">❌</button></td>
<td><button onclick="setPenAway(3,'')">○</button></td>
</tr>

<tr>
<td><b>Visitante P5</b></td>
<td><button onclick="setPenAway(4,'G')">⚽</button></td>
<td><button onclick="setPenAway(4,'E')">❌</button></td>
<td><button onclick="setPenAway(4,'')">○</button></td>
</tr>

</table>

<br>

<button onclick="resetPenalties()">
Reiniciar Penales
</button>

</div>

</div>

<script type="module" src="control.js"></script>

</body>
</html>
