<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<title>Overlay Marcador</title>

<link rel="stylesheet" href="style.css">

</head>

<body>
    

<div id="container">

    <!-- MARCADOR PRINCIPAL -->
     <!-- TARJETAS ROJAS LOCAL -->

    <div id="lr1" class="redCard"></div>
    <div id="lr2" class="redCard"></div>
    <div id="lr3" class="redCard"></div>
    <div id="lr4" class="redCard"></div>
    <div id="lr5" class="redCard"></div>

    <!-- TARJETAS ROJAS VISITANTE -->

    <div id="ar1" class="redCard"></div>
    <div id="ar2" class="redCard"></div>
    <div id="ar3" class="redCard"></div>
    <div id="ar4" class="redCard"></div>
    <div id="ar5" class="redCard"></div>

    <img id="bg" src="assets/marcador.png">

    <div id="localTeam" class="team">BOC</div>

    <div id="localScore" class="score">0</div>

    <div id="awayScore" class="score">0</div>

    <div id="awayTeam" class="team">RIV</div>

    <div id="clock">00:00</div>

    <div id="period">1T</div>

    <div id="addedTime">+4</div>

    <!-- ===========================
         PENALES
    ============================ -->

    <img id="penBg" src="assets/penales.png">

    <div id="penalties">

        <div id="penLocalName" class="penTeamName">
            BOCA JUNIORS
        </div>

    <div id="penAwayName" class="penTeamName">
        RIVER PLATE
    </div>

        <!-- LOCAL -->

        <div id="pl1" class="pen"></div>
        <div id="pl2" class="pen"></div>
        <div id="pl3" class="pen"></div>
        <div id="pl4" class="pen"></div>
        <div id="pl5" class="pen"></div>

        <!-- VISITANTE -->

        <div id="pa1" class="pen"></div>
        <div id="pa2" class="pen"></div>
        <div id="pa3" class="pen"></div>
        <div id="pa4" class="pen"></div>
        <div id="pa5" class="pen"></div>

    </div>

</div>

<script type="module" src="overlay.js"></script>

</body>

</html>
